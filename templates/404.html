{% extends 'base.html' %}

{% block title %}Page Not Found - CampusConnect{% endblock %}

{% block content %}
<div class="empty-state-global" style="margin: 4rem auto; max-width: 540px; padding: 2.5rem 1.5rem;">
    <div class="empty-icon" aria-hidden="true">🏛️</div>
    <span class="pill-badge pill-lost" style="margin: 0.5rem auto 1rem; display: inline-block;">404 ERROR</span>
    <h1 class="empty-title">Page Not Found</h1>
    <p class="empty-desc">
        The campus record or page you are looking for does not exist or has been removed.
    </p>
    <div class="empty-actions" style="margin-top: 1.5rem;">
        <a href="{{ url_for('index') }}" class="btn-primary">
            Browse Items
        </a>
        <a href="{{ url_for('submit_item') }}" class="btn-secondary">
            Report Item
        </a>
    </div>
</div>
{% endblock %}
